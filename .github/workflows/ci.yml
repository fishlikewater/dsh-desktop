# CI 流水线：静态检查 → 单测 → 构建 → 打包
#
# 说明：
# - 冒烟（scripts/smoke，CDP 端到端）依赖本机 DSH 服务（dsh CLI）与 ~/.dsh 配置，
#   CI runner 无 dsh 安装，故不作为 CI 步骤；本地以 `npm run smoke` 验证
#   （见 docs/testing.md）。
# - 工具链为 windows-gnu（项目决策），链接器配置由 scripts/setup-gnu-linker.mjs 生成。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust 工具链（windows-gnu）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: 设置默认 gnu 工具链
        run: rustup default stable-x86_64-pc-windows-gnu

      - name: 安装 gnu 工具链组件（rustfmt/clippy）
        # dtolnay action 的 components 装在默认 host 工具链上，而 rustup default
        # 已切到 gnu；必须给 gnu 工具链单独补装，否则 cargo fmt/clippy 报
        # "not installed for the toolchain"
        run: rustup component add rustfmt clippy --toolchain stable-x86_64-pc-windows-gnu

      - name: 生成 gnu 链接器配置（.cargo/config.toml）
        run: node scripts/setup-gnu-linker.mjs

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: 静态检查（clippy -D warnings + 前端脚本/CSP hash）
        run: npm run check

      - name: 单元测试
        # windows-gnu 测试 exe 加载失败的已知原因（0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND）：
        # mingw 运行时 DLL（libgcc_s_seh-1.dll/libwinpthread-1.dll）不在 exe 目录，
        # 加载器按 PATH 搜索时可能命中 Git for Windows 的旧版 mingw64 DLL（导出符号缺失）。
        # 注：__TAURI_WORKSPACE__ manifest workaround 仅对 msvc 生效（tauri build.rs 判断），
        # gnu 需自行保证运行时 DLL 搜索路径正确。
        # 对策：把当前工具链 sysroot 的 bin（rustc --print sysroot）前置 PATH，
        # 并剔除 Git mingw64，确保加载与新工具链匹配的运行时。
        shell: pwsh
        run: |
          $sysroot = (& rustc --print sysroot) | Select-Object -First 1
          $rustBin = Join-Path $sysroot "lib\rustlib\x86_64-pc-windows-gnu\bin"
          Write-Host "sysroot: $sysroot"
          Write-Host "rustBin 存在: $(Test-Path $rustBin)"
          if (Test-Path $rustBin) {
            Get-ChildItem $rustBin -Filter *.dll | ForEach-Object { Write-Host "DLL: $($_.Name)" }
          }
          $targetDebug = "src-tauri\target\debug"
          Write-Host "target/debug 存在 WebView2Loader.dll: $(Test-Path (Join-Path $targetDebug 'WebView2Loader.dll'))"
          $cleanPath = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw64' }) -join ';'
          $env:PATH = "$rustBin;$cleanPath;$targetDebug"
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Debug 构建
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Release 构建 + NSIS 打包
        run: npm run build
        env:
          # createUpdaterArtifacts: true → tauri build 需签名私钥；与 release.yml
          # 对齐注入密钥（空串密码：本项目私钥未设密码）。secret 缺失时该步报错
          # 即 CI 失败（保护发版所需签名的可复现性）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
