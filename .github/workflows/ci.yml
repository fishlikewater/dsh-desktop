# CI 流水线：静态检查 → 单测 → 构建 → 打包
#
# 说明：
# - 冒烟（scripts/smoke，CDP 端到端）依赖本机 DSH 服务（dsh CLI）与 ~/.dsh 配置，
#   CI runner 无 dsh 安装，故不作为 CI 步骤；本地以 `npm run smoke` 验证
#   （见 docs/testing.md）。
# - 工具链为 windows-gnu（项目决策），链接器配置由 scripts/setup-gnu-linker.mjs 生成。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust 工具链（windows-gnu）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: 设置默认 gnu 工具链
        run: rustup default stable-x86_64-pc-windows-gnu

      - name: 安装 gnu 工具链组件（rustfmt/clippy）
        # dtolnay action 的 components 装在默认 host 工具链上，而 rustup default
        # 已切到 gnu；必须给 gnu 工具链单独补装，否则 cargo fmt/clippy 报
        # "not installed for the toolchain"
        run: rustup component add rustfmt clippy --toolchain stable-x86_64-pc-windows-gnu

      - name: 生成 gnu 链接器配置（.cargo/config.toml）
        run: node scripts/setup-gnu-linker.mjs

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: 静态检查（clippy -D warnings + 前端脚本/CSP hash）
        run: npm run check

      - name: 单元测试
        # windows-gnu 测试 exe 0xc0000139（STATUS_ENTRYPOINT_NOT_FOUND）修复：
        # 1) __TAURI_WORKSPACE__ manifest workaround 仅对 msvc 生效（tauri build.rs 判断），
        #    windows-gnu 不适用；
        # 2) webview2-com-sys 在 gnu 下 #[link(name="WebView2Loader.dll")] 动态链接，
        #    测试 exe 运行需在搜索路径找到匹配版本的 DLL——直接把运行时 DLL
        #    （mingw 运行时 + WebView2Loader.dll）复制到 exe 同目录（deps/）最可靠；
        # 3) 用 Git 自带 objdump dump 导入表验证假设。
        shell: pwsh
        run: |
          $sysroot = (& rustc --print sysroot) | Select-Object -First 1
          $rustBin = Join-Path $sysroot "lib\rustlib\x86_64-pc-windows-gnu\bin"
          $deps = "src-tauri\target\debug\deps"
          Write-Host "== 复制运行时 DLL 到 exe 目录 =="
          Copy-Item (Join-Path $rustBin "*.dll") $deps -Force -ErrorAction SilentlyContinue
          $wv2 = "src-tauri\target\debug\WebView2Loader.dll"
          if (Test-Path $wv2) { Copy-Item $wv2 $deps -Force }
          Get-ChildItem $deps -Filter *.dll | ForEach-Object { Write-Host "  deps DLL: $($_.Name)" }
          Write-Host "== 导入表 dump（Git 自带 objdump）=="
          $objdump = "C:\Program Files\Git\mingw64\bin\objdump.exe"
          if (Test-Path $objdump) {
            Get-ChildItem $deps -Filter "dsh_desktop_lib-*.exe" | Where-Object { $_.Name -notmatch '^lib' } | Select-Object -First 1 | ForEach-Object {
              Write-Host "  exe: $($_.Name)"
              & $objdump -p $_.FullName | Select-String "DLL Name" | ForEach-Object { Write-Host "    IMPORT: $($_.Line.Trim())" }
            }
          } else {
            Write-Host "  (Git objdump 不存在，跳过)"
          }
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Debug 构建
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Release 构建 + NSIS 打包
        run: npm run build
        env:
          # createUpdaterArtifacts: true → tauri build 需签名私钥；与 release.yml
          # 对齐注入密钥（空串密码：本项目私钥未设密码）。secret 缺失时该步报错
          # 即 CI 失败（保护发版所需签名的可复现性）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
