# CI 流水线：静态检查 → 单测 → 构建 → 打包
#
# 说明：
# - 冒烟（scripts/smoke，CDP 端到端）依赖本机 DSH 服务（dsh CLI）与 ~/.dsh 配置，
#   CI runner 无 dsh 安装，故不作为 CI 步骤；本地以 `npm run smoke` 验证
#   （见 docs/testing.md）。
# - 工具链为 windows-gnu（项目决策），链接器配置由 scripts/setup-gnu-linker.mjs 生成。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust 工具链（windows-gnu）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: 设置默认 gnu 工具链
        run: rustup default stable-x86_64-pc-windows-gnu

      - name: 安装 gnu 工具链组件（rustfmt/clippy）
        # dtolnay action 的 components 装在默认 host 工具链上，而 rustup default
        # 已切到 gnu；必须给 gnu 工具链单独补装，否则 cargo fmt/clippy 报
        # "not installed for the toolchain"
        run: rustup component add rustfmt clippy --toolchain stable-x86_64-pc-windows-gnu

      - name: 生成 gnu 链接器配置（.cargo/config.toml）
        run: node scripts/setup-gnu-linker.mjs

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: 静态检查（clippy -D warnings + 前端脚本/CSP hash）
        run: npm run check

      - name: 单元测试
        # windows-gnu 测试 exe 0xc0000139 诊断 + 修复：
        # __TAURI_WORKSPACE__ manifest workaround 仅对 msvc 生效（tauri build.rs 判断），
        # gnu 下需自行保证测试 exe 的导入 DLL 可解析。先 dump 导入表定位缺失项。
        shell: pwsh
        run: |
          $sysroot = (& rustc --print sysroot) | Select-Object -First 1
          $rustBin = Join-Path $sysroot "lib\rustlib\x86_64-pc-windows-gnu\bin"
          Write-Host "== toolchain bin 内容 =="
          Get-ChildItem $rustBin | ForEach-Object { Write-Host "  $($_.Name)" }
          Get-ChildItem (Join-Path $rustBin 'self-contained') -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  sc/$($_.Name)" }
          Write-Host "== 导入表 dump =="
          $exe = Get-ChildItem "src-tauri\target\debug\deps\dsh_desktop_lib-*.exe" | Where-Object { $_.Name -notmatch '\.d$' -and $_.Name -notmatch '^lib' } | Select-Object -First 1
          Write-Host "exe: $($exe.FullName)"
          $objdump = Get-ChildItem $rustBin -Recurse -Filter "objdump.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "objdump: $($objdump.FullName)"
          if ($objdump) {
            & $objdump.FullName -p $exe.FullName | Select-String "DLL Name" | ForEach-Object { Write-Host "  IMPORT: $($_.Line.Trim())" }
          } else {
            Write-Host "  (未找到 objdump，跳过导入表 dump)"
          }
          $targetDebug = "src-tauri\target\debug"
          $cleanPath = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw64' }) -join ';'
          $env:PATH = "$targetDebug;$rustBin;$cleanPath"
          Write-Host "== 直接运行测试 exe（捕获加载错误）=="
          & $exe.FullName --list 2>&1 | Select-Object -First 5
          Write-Host "exit: $LASTEXITCODE"
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Debug 构建
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Release 构建 + NSIS 打包
        run: npm run build
        env:
          # createUpdaterArtifacts: true → tauri build 需签名私钥；与 release.yml
          # 对齐注入密钥（空串密码：本项目私钥未设密码）。secret 缺失时该步报错
          # 即 CI 失败（保护发版所需签名的可复现性）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
