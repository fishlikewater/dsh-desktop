# 发布流水线：推送 v* tag 时自动构建 macOS/Windows 安装包并发布 GitHub Release 草稿
#
# 说明：
# - 触发：git push origin main --tags（docs/release-process.md 发版流程）
# - Windows：windows-gnu 工具链 + NSIS（与 ci.yml 一致），tauri-action 建/更 Release
#   草稿并上传签名 latest.json（updater 清单）；另附 SHA256SUMS.txt
# - macOS：Apple Silicon（aarch64-apple-darwin）+ dmg/app；构建后对该 .app 做 ad-hoc
#   签名（codesign -，无需证书），重建 dmg / updater 包并重签 .sig 后覆盖上传
#   （Apple Silicon 原生二进制无签名时 macOS 报「已损坏，无法打开」）
# - updater endpoint 占位 OWNER/REPO 由 scripts/patch-updater-endpoint.mjs
#   在构建前替换为真实仓库（$GITHUB_REPOSITORY）
# - 签名私钥经 secret TAURI_SIGNING_PRIVATE_KEY 注入（内容为本地 .tauri/dsh-desktop.key，
#   勿提交仓库）；未配置时 Windows 构建可完成但 latest.json 无签名（updater 不可用）
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-gnu
            bundles: nsis
            updater_json: "true"
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
            updater_json: "false"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 设置默认 gnu 工具链（Windows）
        if: runner.os == 'Windows'
        run: rustup default stable-x86_64-pc-windows-gnu

      - name: 生成 gnu 链接器配置（Windows）
        if: runner.os == 'Windows'
        run: node scripts/setup-gnu-linker.mjs

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 校验 tag 与版本一致
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version;const tag=process.env.GITHUB_REF_NAME;if(tag!=='v'+v){console.error('tag '+tag+' 与版本 v'+v+' 不一致');process.exit(1)}console.log('OK: '+tag+' = v'+v)"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 替换 updater endpoint 为真实仓库
        run: node scripts/patch-updater-endpoint.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 构建并发布（Windows NSIS + 签名 latest.json）
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: "DSH Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          includeUpdaterJson: ${{ matrix.updater_json }}

      - name: 构建并发布（macOS dmg/app）
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # createUpdaterArtifacts 为全局配置，mac 构建同样生成签名产物
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: "DSH Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          includeUpdaterJson: ${{ matrix.updater_json }}

      # macOS ad-hoc 签名：Tauri bundler 不支持 ad-hoc（需证书 identity），
      # 构建后对本地产物递归 codesign -（arm64 无签名无法启动 -> 报「已损坏」），
      # 重建 updater tar.gz 并用同一密钥重签 .sig、重建 dmg，再覆盖上传。
      - name: macOS ad-hoc 签名并重建产物
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euxo pipefail
          WORK="$(pwd)"
          APP="$(find src-tauri/target -type d -name 'DSH Desktop.app' -print -quit)"
          [ -n "$APP" ] || { echo "未找到 DSH Desktop.app"; exit 1; }
          APP_DIR="$(dirname "$APP")"
          ROOT="$(dirname "$APP_DIR")"   # bundle 根目录
          VERSION="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")"

          # 1) ad-hoc 签名整个 .app（--force 重签内部所有二进制/框架）
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP" || { echo "codesign verify FAILED"; exit 1; }
          codesign -dv "$APP" 2>&1 | sed -n 's/.*Signature=\(.*\)/signature: \1/p'

          # 2) 重建 updater app.tar.gz（tar 顶层为 .app 目录，与 tauri updater_bundle 一致）
          cd "$WORK/$APP_DIR"
          rm -f "DSH Desktop.app.tar.gz" "DSH Desktop.app.tar.gz.sig"
          tar -czf "DSH Desktop.app.tar.gz" "DSH Desktop.app"
          # 3) 重新生成 .sig（tar 内容已变化，原 sig 失效）
          #    tauri signer 对 env 私钥（TAURI_SIGNING_PRIVATE_KEY）与默认路径私钥
          #    同时存在时报冲突（--private-key 与 --private-key-path 互斥）。
          #    故将密钥写入临时文件、unset env 后走 --private-key-path。
          #    注意：-f 是 --private-key-path 的短选项，待签名文件必须是位置参数。
          KEY_FILE="$(mktemp /tmp/dsh-signer-key.XXXXXX)"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          unset TAURI_SIGNING_PRIVATE_KEY
          npx tauri signer sign --private-key-path "$KEY_FILE" --password "" "DSH Desktop.app.tar.gz"
          rm -f "$KEY_FILE"

          # 4) 重建 dmg（staging：.app + Applications 链接），覆盖原生 dmg
          cd "$WORK/$ROOT"
          STAGE="dmg-stage"; rm -rf "$STAGE"; mkdir -p "$STAGE" dmg
          cp -R "$WORK/$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="dmg/DSH Desktop_${VERSION}_aarch64.dmg"
          hdiutil create -volname "DSH Desktop" -srcfolder "$STAGE" -ov -format UDZO "$DMG"

          # 5) 以 Release 资产名（空格->点，同 tauri-action）覆盖上传
          mv "macos/DSH Desktop.app.tar.gz" "macos/DSH.Desktop_aarch64.app.tar.gz"
          mv "macos/DSH Desktop.app.tar.gz.sig" "macos/DSH.Desktop_aarch64.app.tar.gz.sig"
          mv "$DMG" "dmg/DSH.Desktop_${VERSION}_aarch64.dmg"
          gh release upload "$GITHUB_REF_NAME" \
            "macos/DSH.Desktop_aarch64.app.tar.gz" \
            "macos/DSH.Desktop_aarch64.app.tar.gz.sig" \
            "dmg/DSH.Desktop_${VERSION}_aarch64.dmg" --clobber

      # ===== macOS 开发者签名 + 公证（Task 13 前置工程：凭据注入即启用）=====
      # 覆盖 ad-hoc 签名（Developer ID 身份必须已导入 runner keychain；
      # MACOS_SIGNING_IDENTITY 可指定，默认 "Developer ID Application"）。
      # 凭据缺席时跳过（显式说明见下条 SKIP 步骤）；不做假公证。
      - name: macOS Developer ID 签名 + 公证（notarytool submit + staple）
        id: mac-notarize
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          WORK="$(pwd)"
          APP="$(find src-tauri/target -type d -name 'DSH Desktop.app' -print -quit)"
          [ -n "$APP" ] || { echo "未找到 DSH Desktop.app"; exit 1; }
          ROOT="$(dirname "$(dirname "$APP")")"
          VERSION="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")"
          IDENTITY="${MACOS_SIGNING_IDENTITY:-Developer ID Application}"

          # 1) Developer ID + 强化运行时 签名（覆盖 ad-hoc）
          codesign --force --deep --sign "$IDENTITY" --timestamp --options runtime "$APP"

          # 2) 公证（--wait 阻塞到结果；失败即 job 失败）
          xcrun notarytool submit "$APP" --wait --apple-id "$APPLE_ID" \
            --apple-team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" \
            --output-format json
          # 3) staple 票据到 .app（离线可验证）
          xcrun stapler staple "$APP"

          # 4) 重建 updater tar.gz + .sig（内容已变），重签 .sig
          cd "$WORK/$(dirname "$APP")"
          rm -f "DSH Desktop.app.tar.gz" "DSH Desktop.app.tar.gz.sig"
          tar -czf "DSH Desktop.app.tar.gz" "DSH Desktop.app"
          KEY_FILE="$(mktemp /tmp/dsh-signer-key.XXXXXX)"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          unset TAURI_SIGNING_PRIVATE_KEY
          npx tauri signer sign --private-key-path "$KEY_FILE" --password "" "DSH Desktop.app.tar.gz"
          rm -f "$KEY_FILE"

          # 5) 重建 dmg（staging：.app + Applications 链接）
          cd "$WORK/$ROOT"
          STAGE="dmg-stage"; rm -rf "$STAGE"; mkdir -p "$STAGE" dmg
          cp -R "$WORK/$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="dmg/DSH Desktop_${VERSION}_aarch64.dmg"
          hdiutil create -volname "DSH Desktop" -srcfolder "$STAGE" -ov -format UDZO "$DMG"

          # 6) 覆盖上传（公证后的产物）
          mv "macos/DSH Desktop.app.tar.gz" "macos/DSH.Desktop_aarch64.app.tar.gz"
          mv "macos/DSH Desktop.app.tar.gz.sig" "macos/DSH.Desktop_aarch64.app.tar.gz.sig"
          mv "$DMG" "dmg/DSH.Desktop_${VERSION}_aarch64.dmg"
          gh release upload "$GITHUB_REF_NAME" \
            "macos/DSH.Desktop_aarch64.app.tar.gz" \
            "macos/DSH.Desktop_aarch64.app.tar.gz.sig" \
            "dmg/DSH.Desktop_${VERSION}_aarch64.dmg" --clobber

      - name: macOS 签名验证（codesign --verify + spctl --assess）
        if: runner.os == 'macOS' && steps.mac-notarize.outcome == 'success'
        shell: bash
        run: |
          APP="$(find src-tauri/target -type d -name 'DSH Desktop.app' -print -quit)"
          [ -n "$APP" ] || { echo "未找到 DSH Desktop.app"; exit 1; }
          codesign --verify --deep --strict "$APP" || exit 1
          spctl --assess --type execute --verbose=4 "$APP" || exit 1

      - name: 通知：macOS 公证未配置（Task 13 blocked 说明）
        if: runner.os == 'macOS' && (env.APPLE_ID == '' || env.APPLE_PASSWORD == '' || env.APPLE_TEAM_ID == '')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "SKIP: Apple 公证凭据未配置——产物保持 ad-hoc 签名（Task 13 处于 blocked，启用步骤见 docs/release-process.md）"

      # tauri-action 上传主产物；.sig 需在代码签名**之后**重签（signtool 会改变
      # exe 字节，原 sig 失效）——重签步骤见「重签 Windows updater .sig」。
      # ===== Windows 代码签名（Task 13 前置工程：secrets 注入即启用）=====
      # 证书未采购时该步骤跳过（显式说明见下条 SKIP 步骤）；不做假签名。
      - name: Windows 代码签名（signtool /fd SHA256 /tr RFC3161）
        id: win-sign
        if: runner.os == 'Windows' && env.WIN_CERT != ''
        shell: pwsh
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CODESIGN_CERT_B64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
                 Where-Object { $_.Name -notlike "*.sig" } | Select-Object -First 1
          [System.IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\codesign.pfx",
            [Convert]::FromBase64String($env:WIN_CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse `
            -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 `
            /tr http://timestamp.digicert.com `
            /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:WIN_CERT_PASSWORD $exe.FullName

      - name: Windows 签名验证（signtool verify /pa）
        if: runner.os == 'Windows' && steps.win-sign.outcome == 'success'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
                 Where-Object { $_.Name -notlike "*.sig" } | Select-Object -First 1
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse `
            -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa $exe.FullName

      - name: 重签 Windows updater .sig（代码签名后 exe 已变，原 sig 失效）
        if: runner.os == 'Windows' && steps.win-sign.outcome == 'success'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
                 Where-Object { $_.Name -notlike "*.sig" } | Select-Object -First 1
          $keyFile = Join-Path $env:RUNNER_TEMP "dsh-signer.key"
          Set-Content -Path $keyFile -Value $env:TAURI_SIGNING_PRIVATE_KEY -NoNewline
          $env:TAURI_SIGNING_PRIVATE_KEY = ""
          npx tauri signer sign --private-key-path $keyFile --password "" $exe.FullName
          Remove-Item $keyFile
          $sigPath = "$($exe.FullName).sig"
          gh release upload ${{ github.ref_name }} $sigPath --clobber

      - name: 通知：Windows 签名未配置（Task 13 blocked 说明）
        if: runner.os == 'Windows' && env.WIN_CERT == ''
        shell: pwsh
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CODESIGN_CERT_B64 }}
        run: |
          Write-Host "SKIP: WINDOWS_CODESIGN_CERT_B64 未配置——产物未做代码签名（Task 13 处于 blocked，启用步骤见 docs/release-process.md）"

      - name: 生成 SHA256SUMS（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding UTF8

      - name: 上传 SHA256SUMS 到 Release（Windows）
        if: runner.os == 'Windows'
        continue-on-error: true
        run: gh release upload ${{ github.ref_name }} SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 聚合 job：双平台构建完成后，从 Release 资产取两平台签名，
  # 组装含 windows-x86_64 与 darwin-aarch64 的 latest.json 并上传（覆盖）。
  publish-updater-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 生成 latest.json（双平台）
        run: node scripts/build-latest-json.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 上传 latest.json
        run: gh release upload ${{ github.ref_name }} latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
