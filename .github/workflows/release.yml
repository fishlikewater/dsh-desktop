# 发布流水线：推送 v* tag 时自动构建 macOS/Windows 安装包并发布 GitHub Release 草稿
#
# 说明：
# - 触发：git push origin main --tags（docs/release-process.md 发版流程）
# - Windows：windows-gnu 工具链 + NSIS（与 ci.yml 一致），tauri-action 建/更 Release
#   草稿并上传签名 latest.json（updater 清单）；另附 SHA256SUMS.txt
# - macOS：Apple Silicon（aarch64-apple-darwin）+ dmg/app，未签名/未公证
# - updater endpoint 占位 OWNER/REPO 由 scripts/patch-updater-endpoint.mjs
#   在构建前替换为真实仓库（$GITHUB_REPOSITORY）
# - 签名私钥经 secret TAURI_SIGNING_PRIVATE_KEY 注入（内容为本地 .tauri/dsh-desktop.key，
#   勿提交仓库）；未配置时 Windows 构建可完成但 latest.json 无签名（updater 不可用）
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-gnu
            bundles: nsis
            updater_json: "true"
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
            updater_json: "false"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 设置默认 gnu 工具链（Windows）
        if: runner.os == 'Windows'
        run: rustup default stable-x86_64-pc-windows-gnu

      - name: 生成 gnu 链接器配置（Windows）
        if: runner.os == 'Windows'
        run: node scripts/setup-gnu-linker.mjs

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 校验 tag 与版本一致
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version;const tag=process.env.GITHUB_REF_NAME;if(tag!=='v'+v){console.error('tag '+tag+' 与版本 v'+v+' 不一致');process.exit(1)}console.log('OK: '+tag+' = v'+v)"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 替换 updater endpoint 为真实仓库
        run: node scripts/patch-updater-endpoint.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 构建并发布（Windows NSIS + 签名 latest.json）
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: "DSH Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          includeUpdaterJson: ${{ matrix.updater_json }}

      - name: 构建并发布（macOS dmg/app）
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: "DSH Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          includeUpdaterJson: ${{ matrix.updater_json }}

      - name: 生成 SHA256SUMS（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding UTF8

      - name: 上传 SHA256SUMS 到 Release（Windows）
        if: runner.os == 'Windows'
        continue-on-error: true
        run: gh release upload ${{ github.ref_name }} SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tauri-action 不把 .exe.sig 作为资产上传，导致其 updater JSON 路径
      # 跳过 latest.json；这里自行上传签名并生成清单（signature = .sig 内容）。
      - name: 上传签名并发布 latest.json（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if (-not $sig) { Write-Error "未找到 .exe.sig（检查 TAURI_SIGNING_PRIVATE_KEY secret 是否配置正确）"; exit 1 }
          gh release upload ${{ github.ref_name }} $sig.FullName --clobber
          node scripts/build-latest-json.mjs
          gh release upload ${{ github.ref_name }} latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
