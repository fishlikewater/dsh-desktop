<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH Desktop</title>
    <style>
            :root {
        --titlebar-h: 40px;
        /* Codex Light 配色（固定浅色，与 DSH GUI 整体风格统一） */
        --titlebar-bg: #f2f3f3;
        --border: #e0e0e0;
        --fg: #1f1f1f;
        --muted: #8e8e93;
        --title-fg: #1f1f1f;
        --icon-fg: #141414;
        --hover: rgba(0, 0, 0, 0.05);
        --close-hover: #e81123;
        --overlay-bg: #f2f3f3;
        --card-bg: #ffffff;
        --card-border: #e5e5e5;
        --code-bg: #f2f3f3;
        --code-fg: #6a5acd;
        --status-fg: #d9645a;
        --err-fg: #dc2626;
        --btn-bg: #d9645a;
        --btn-bg-hover: #c9554a;
        --accent: #d9645a;
        --accent-hover: #c9554a;
        --panel-bg: #f7f8fa;
      }
      /* ===== DSH 主题同步（外观设置在 DSH GUI 里修改，持久化于 ~/.dsh/settings.yaml
         ui-theme.preference：light | dark | system）。壳页 JS 读取后设置 body 类；
         system（无类）时跟随系统 prefers-color-scheme。===== */
      body.theme-dark {
        --titlebar-bg: #1f2124;
        --border: #33363b;
        --fg: #e8e8e8;
        --muted: #9ca3af;
        --title-fg: #e8e8e8;
        --icon-fg: #e8e8e8;
        --hover: rgba(255, 255, 255, 0.09);
        --close-hover: #e81123;
        --overlay-bg: #1f2124;
        --card-bg: #26282c;
        --card-border: #3a3d42;
        --code-bg: #2a2d31;
        --code-fg: #b3a8ff;
        --status-fg: #e08d7a;
        --err-fg: #f87171;
        --btn-bg: #d9645a;
        --btn-bg-hover: #e27266;
        --accent: #d9645a;
        --accent-hover: #e27266;
        --panel-bg: #232528;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.theme-light):not(.theme-dark) {
          --titlebar-bg: #1f2124;
          --border: #33363b;
          --fg: #e8e8e8;
          --muted: #9ca3af;
          --title-fg: #e8e8e8;
          --icon-fg: #e8e8e8;
          --hover: rgba(255, 255, 255, 0.09);
          --close-hover: #e81123;
          --overlay-bg: #1f2124;
          --card-bg: #26282c;
          --card-border: #3a3d42;
          --code-bg: #2a2d31;
          --code-fg: #b3a8ff;
          --status-fg: #e08d7a;
          --err-fg: #f87171;
          --btn-bg: #d9645a;
          --btn-bg-hover: #e27266;
          --accent: #d9645a;
          --accent-hover: #e27266;
          --panel-bg: #232528;
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: transparent; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--fg);
        display: flex;
        flex-direction: column;
        /* 透明窗口上禁用 ClearType 亚像素渲染（会产生蓝/红边缘色 fringe） */
        -webkit-font-smoothing: antialiased;
      }
      /* ===== 自定义标题栏 ===== */
      #titlebar {
        height: var(--titlebar-h);
        flex: 0 0 var(--titlebar-h);
        display: flex;
        align-items: center;
        background: var(--titlebar-bg);
        border-bottom: 1px solid var(--border);
        -webkit-user-select: none;
      }
      #app-icon { width: 18px; height: 18px; margin: 0 9px 0 14px; flex: 0 0 auto; color: var(--icon-fg); }
      #app-title {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--title-fg);
        letter-spacing: 0.3px;
        white-space: nowrap;
      }
      #drag-region { flex: 1; height: 100%; }
      /* ===== 连接状态圆点（服务离线/加载/在线）===== */
      #status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin: 0 10px 0 6px;
        flex: 0 0 auto;
        background: var(--status-offline, #e5484d);
        pointer-events: none; /* 不拦截标题栏拖拽 */
      }
      #status-dot.loading { background: var(--status-loading, #f5a524); }
      #status-dot.online { background: var(--status-online, #3fb950); }
      #status-dot.offline { background: var(--status-offline, #e5484d); }
      .win-btn {
        width: 46px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        color: var(--fg);
        cursor: default;
        outline: none;
      }
      .win-btn:hover { background: var(--hover); }
      .win-btn.close:hover { background: var(--close-hover); }
      .win-btn svg { width: 10px; height: 10px; fill: currentColor; display: block; }
      #btn-max .restore { display: none; }
      #titlebar.maximized #btn-max .maximize { display: none; }
      #titlebar.maximized #btn-max .restore { display: block; }
      /* ===== macOS 原生标题栏适配（红绿灯按钮 + 原生全屏）=====
         壳页 JS 检测到 macOS 时给 body 加 .mac：
         - 标题栏改 28px（与 macOS 标准标题栏同高，红绿灯默认垂直中心正好居中）；
         - 左侧留出红绿灯按钮区域（关闭/最小化/全屏三个原生按钮，壳页隐藏
           Windows 风格的对应按钮）；
         - 隐藏自绘边缘 resize 热区（原生装饰下系统提供边缘调整）。 */
      body.mac #titlebar {
        height: 28px;
        flex: 0 0 28px;
        padding-left: 86px;
      }
      body.mac #app-icon { margin: 0 8px 0 0; }
      body.mac #btn-min, body.mac #btn-max, body.mac #btn-close { display: none; }
      body.mac .resize-h { display: none; }
      /* macOS 使用不透明窗口（透明窗口与原生全屏不兼容）：body 铺满背景色，
         避免暗色主题下窗口边缘露白 */
      body.mac { background: var(--titlebar-bg); }
      /* ===== 内容区 ===== */
      #frame-wrap { flex: 1; position: relative; background: transparent; }
      #dsh-frame { width: 100%; height: 100%; border: none; display: block; background: transparent; }
      /* ===== 服务不可用覆盖层 ===== */
      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--overlay-bg);
      }
      #overlay.show { display: flex; }
      .card {
        text-align: center;
        max-width: 560px;
        padding: 52px 44px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 18px;
      }
      .card h1 { font-size: 23px; font-weight: 600; margin-bottom: 12px; }
      .card p { font-size: 14px; line-height: 1.8; color: var(--muted); }
      .card code {
        background: var(--code-bg);
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 13px;
        color: var(--code-fg);
        font-family: Consolas, monospace;
      }
      .status {
        margin-top: 22px;
        font-size: 13px;
        color: var(--status-fg);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--status-fg);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .card button {
        margin-top: 22px;
        padding: 9px 30px;
        font-size: 14px;
        color: #fff;
        background: var(--btn-bg);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .card button:hover { background: var(--btn-bg-hover); }
      .card button.primary { background: var(--accent); }
      .card button.primary:hover { background: var(--accent-hover); }
      .card button:disabled { opacity: 0.6; cursor: default; }
      .err { margin-top: 12px; font-size: 12px; color: var(--err-fg); min-height: 16px; }
      /* ===== 设置弹层（T5.4）===== */
      #settings-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.30);
        align-items: center;
        justify-content: center;
      }
      #settings-modal.show { display: flex; }
      .settings-card {
        width: 420px;
        max-width: calc(100% - 48px);
        padding: 28px 28px 24px;
      }
      .settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--card-border);
      }
      .settings-head h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
        line-height: 28px; /* 与关闭按钮（28px）同高，保证垂直中心对齐 */
      }
      .settings-head button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        margin-top: 0; /* 覆盖 .card button 的 margin-top:22px，保持垂直居中 */
        padding: 0;
        border: none;
        background: none;
        border-radius: 6px;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        color: var(--muted);
      }
      .settings-head button:hover { background: var(--hover); color: var(--fg); }
      .settings-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid var(--card-border);
      }
      .settings-row .label { width: 72px; flex: none; font-size: 13px; color: var(--muted); }
      .settings-row code { font-size: 12px; background: var(--code-bg); padding: 3px 8px; border-radius: 5px; flex: none; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .settings-row .hint { font-size: 11px; color: var(--muted); flex: 1; min-width: 0; text-align: right; line-height: 1.5; }
      /* 服务地址行：说明独立成行，避免与 URL 同排挤压 */
      .settings-row.row-url { flex-wrap: wrap; }
      .settings-row.row-url .hint { flex-basis: 100%; padding-left: 84px; text-align: left; }
      .settings-row.row-url select,
      .settings-row.row-url input[type="text"] {
        font-size: 12px; padding: 4px 8px; border: 1px solid var(--border);
        border-radius: 5px; background: var(--code-bg); color: var(--fg);
        flex: 1; min-width: 120px; font-family: ui-monospace, monospace;
      }
      .settings-row.row-url select { flex: 0 0 auto; max-width: 220px; }
      .settings-row.row-url input[type="text"] { margin: 0 6px; }
      .settings-row .mini {
        margin-top: 0; /* 覆盖 .card button 的 margin-top:22px，行内垂直居中 */
        padding: 6px 14px;
        font-size: 12px;
        color: var(--fg);
        background: var(--panel-bg);
        border: 1px solid var(--card-border);
        border-radius: 6px;
        cursor: pointer;
      }
      .settings-row .mini:hover { background: var(--hover); }
      .settings-row .mini:disabled { opacity: 0.6; cursor: default; }
      /* 操作按钮/开关右对齐：与各行控制项纵向对齐 */
      .settings-row .mini { margin-left: auto; }
      .settings-row .switch { margin-left: auto; }
      /* 「更新」按钮紧邻「检查更新」，不被 margin-left:auto 二次推离 */
      .settings-row #settings-update-install { margin-left: 0; }
      .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex: none; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .switch .track {
        position: absolute;
        inset: 0;
        background: var(--card-border);
        border-radius: 10px;
        transition: background 0.15s;
        cursor: pointer;
      }
      .switch .track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.15s;
      }
      .switch input:checked + .track { background: var(--accent); }
      .switch input:checked + .track::after { transform: translateX(18px); }
      /* ===== 自绘边缘 resize 热区（替代系统 WS_THICKFRAME 隐藏边框）===== */
      .resize-h {
        position: absolute;
        z-index: 30;
        background: transparent;
      }
      .resize-n { top: 0; left: 14px; right: 14px; height: 6px; cursor: n-resize; }
      .resize-s { bottom: 0; left: 14px; right: 14px; height: 6px; cursor: s-resize; }
      .resize-e { right: 0; top: 14px; bottom: 14px; width: 6px; cursor: e-resize; }
      .resize-w { left: 0; top: 14px; bottom: 14px; width: 6px; cursor: w-resize; }
      .resize-ne { top: 0; right: 0; width: 14px; height: 14px; cursor: ne-resize; }
      .resize-nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nw-resize; }
      .resize-se { bottom: 0; right: 0; width: 14px; height: 14px; cursor: se-resize; }
      .resize-sw { bottom: 0; left: 0; width: 14px; height: 14px; cursor: sw-resize; }
      /* ===== 定时任务入口（标题栏时钟按钮）===== */
    </style>
  </head>
  <body>
    <!-- 自定义标题栏 -->
    <div id="titlebar">

      </svg>
      <span id="app-title">DSH Desktop</span>
      <span id="status-dot" class="loading" title="DSH 服务连接状态"></span>
      <div id="drag-region"></div>
      <button class="win-btn" id="btn-settings" title="配置" aria-label="配置">
        <svg viewBox="0 0 10 10">
          <circle cx="5" cy="5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.1"/>
          <path d="M5 0.8 V2.2 M5 7.8 V9.2 M0.8 5 H2.2 M7.8 5 H9.2 M1.9 1.9 L2.9 2.9 M7.1 7.1 L8.1 8.1 M8.1 1.9 L7.1 2.9 M2.9 7.1 L1.9 8.1"
            stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="win-btn" id="btn-min" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1"/></svg>
      </button>
      <button class="win-btn" id="btn-max" title="最大化" aria-label="最大化">
        <svg class="maximize" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
        <svg class="restore" viewBox="0 0 10 10">
          <rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.1"/>
          <path d="M2.5 2.5 V0.5 H9.5 V7.5 H7.5" fill="none" stroke="currentColor" stroke-width="1.1"/>
        </svg>
      </button>
      <button class="win-btn close" id="btn-close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 10 10"><path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>

    <!-- 内容区：iframe 嵌入 DSH GUI -->
    <div id="frame-wrap">
      <iframe id="dsh-frame" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
      <!-- 自绘边缘 resize 热区（窗口无系统边框，边缘拖拽调整大小） -->
      <div class="resize-h resize-n" data-dir="n"></div>
      <div class="resize-h resize-s" data-dir="s"></div>
      <div class="resize-h resize-e" data-dir="e"></div>
      <div class="resize-h resize-w" data-dir="w"></div>
      <div class="resize-h resize-ne" data-dir="ne"></div>
      <div class="resize-h resize-nw" data-dir="nw"></div>
      <div class="resize-h resize-se" data-dir="se"></div>
      <div class="resize-h resize-sw" data-dir="sw"></div>
      <!-- 服务不可用覆盖层 -->
      <div id="overlay">
        <div class="card">
          <h1>DSH 服务未运行</h1>
          <p>本窗口需要连接 DeepSeek Harness 服务。</p>
          <p id="target-line">请先运行 <code>dsh</code> 启动服务</p>
          <div class="status"><span class="dot"></span><span id="status-text">正在检测服务…</span></div>
          <button id="retry">立即重试</button>
          <button id="service-start" class="primary">启动 DSH 服务</button>
          <div class="err" id="err"></div>
        </div>
      </div>
      <!-- 设置弹层（T5.4） -->
      <div id="settings-modal">
        <div class="card settings-card">
          <div class="settings-head">
            <h1>配置</h1>
            <button id="settings-close" title="关闭" aria-label="关闭">×</button>
          </div>
          <div class="settings-row row-url">
            <span class="label">服务地址</span>
            <select id="settings-addr-select" title="历史地址"></select>
            <input id="settings-addr-input" type="text" spellcheck="false" placeholder="http://127.0.0.1:3080" />
            <button id="settings-addr-switch" class="mini">切换</button>
            <span class="hint" id="settings-addr-hint">仅本机地址可加载（127.0.0.1/localhost）</span>
          </div>
          <div class="settings-row">
            <span class="label">应用版本</span>
            <code id="settings-version"></code>
            <span class="hint">当前安装的桌面壳版本</span>
          </div>
          <div class="settings-row">
            <span class="label">开机自启</span>
            <label class="switch"><input type="checkbox" id="settings-autostart"><span class="track"></span></label>
          </div>
          <div class="settings-row">
            <span class="label">关闭时退出</span>
            <span class="hint" id="settings-close-hint">关（默认）：关闭隐藏到托盘</span>
            <label class="switch"><input type="checkbox" id="settings-close-exit"><span class="track"></span></label>
          </div>
          <div class="settings-row">
            <span class="label">服务崩溃自动重启</span>
            <span class="hint" id="settings-restart-hint">开：服务异常退出后自动重新拉起</span>
            <label class="switch"><input type="checkbox" id="settings-auto-restart"><span class="track"></span></label>
          </div>
          <div class="settings-row">
            <span class="label">自动更新</span>
            <span class="hint" id="settings-update-result"></span>
            <button id="settings-update-check" class="mini">检查更新</button>
            <button id="settings-update-install" class="mini" disabled>更新</button>
          </div>
          <div class="settings-row">
            <span class="label">日志目录</span>
            <button id="settings-open-logs" class="mini">打开</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ===== 平台识别（macOS：原生红绿灯 + 原生全屏，标题栏样式不同）=====
      const IS_MAC = /Macintosh|Mac OS X/.test(navigator.userAgent);
      if (IS_MAC) document.body.classList.add("mac");

      // ===== 配置 =====
      const params = new URLSearchParams(location.search);
      // 服务地址（Task 10：设置页切换后更新此变量 → tick/frame 单一事实源）
      let DSH_URL = params.get("dsh") || "http://127.0.0.1:3080";
      // DOM 构建而非 innerHTML 拼接：URL 是外部输入，避免注入面
      document.getElementById("target-line").replaceChildren(
        document.createTextNode("请先运行 "),
        Object.assign(document.createElement("code"), { textContent: "dsh" }),
        document.createTextNode(" 启动服务（目标 "),
        Object.assign(document.createElement("code"), { textContent: DSH_URL }),
        document.createTextNode("）")
      );

      // ===== DSH 主题同步（标题栏/覆盖层跟随 DSH GUI 外观设置）=====
      // DSH 把外观偏好持久化在 ~/.dsh/settings.yaml 的 ui-theme.preference
      // （light|dark|system），由 Rust 侧 notify 监听该文件，变化时推送
      // "theme-file-changed" 事件 → 壳页立即重新读取并应用（即时跟随，
      // 取代固定轮询的 0~3s 延迟）；system 时不设类，由 CSS
      // prefers-color-scheme 跟随系统。30s 轮询仅作文件监听失效时的兜底。
      const invoke = window.__TAURI__.core.invoke;
      let lastTheme = null;
      function applyTheme(mode) {
        document.body.classList.toggle("theme-dark", mode === "dark");
        document.body.classList.toggle("theme-light", mode === "light");
        lastTheme = mode;
      }
      async function syncTheme() {
        try {
          const mode = await invoke("theme_preference");
          if (mode !== lastTheme) applyTheme(mode);
        } catch (e) { /* 非 Tauri 环境（浏览器预览）忽略 */ }
      }
      syncTheme();
      window.__TAURI__.event.listen("theme-file-changed", syncTheme);
      setInterval(syncTheme, 30000);

      // ===== 窗口控制（仅本地壳页有 __TAURI__ 权限）=====
      const appWin = window.__TAURI__.window.getCurrentWindow();
      // 伪最大化：系统最大化被禁用（无边框窗口最大化有 DWM -8px 偏移 bug），
      // 这里通过 Rust command 获取工作区，手动把窗口贴齐；还原时恢复之前的位置大小。
      let savedRect = null;

      // ===== 窗口状态记忆（复用上次会话的几何/最大化态，避免每次重置居中） =====
      let saveTimer = null;
      function scheduleSave(state) {
        // 变更停顿 800ms 后合批落盘（resize/move 高频事件防抖）
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function () { persistWindowState(state); }, 800);
      }
      async function persistWindowState(state) {
        try {
          const s = state || {};
          s.x = (await appWin.outerPosition()).x;
          s.y = (await appWin.outerPosition()).y;
          const size = await appWin.outerSize();
          s.w = size.width;
          s.h = size.height;
          if (!IS_MAC) {
            const wa = await getWorkArea();
            s.maximized = wa && Math.abs(size.width - wa[2]) < 24 && Math.abs(size.height - wa[3]) < 24;
          }
          await window.__TAURI__.core.invoke("save_window_state", { state: s });
        } catch (e) {}
      }
      // 工具：构造 PhysicalPosition/PhysicalSize（一次封装，避免散落）
      function physPos(v) { return new window.__TAURI__.window.PhysicalPosition(v.x, v.y); }
      function physSize(v) { return new window.__TAURI__.window.PhysicalSize(v.w, v.h); }

      // 显示窗口：窗口以 visible(false) 创建，等待内容就绪后再显示，
      // 避免 GUI（浅色主题）加载完成前露出暗色背景（启动闪色）。
      // 显示完成后立即恢复记忆几何或居中（事件驱动：不再固定等待 120ms；
      // 隐藏窗口上 setPosition 无效，show 完成后窗口已可见）。
      let centered = false;
      function showWindow() {
        // GUI（iframe）就绪后再同步一次主题：脚本加载时 DSH 服务可能尚未
        // 写入 settings.yaml（读到默认 light），此刻重读可覆盖首启浅色问题。
        syncTheme();
        try {
          appWin.show().then(async function () {
            if (!centered) {
              centered = true;
              try {
                const mem = await window.__TAURI__.core.invoke("load_window_state");
                if (mem && mem.w > 0 && mem.h > 0) {
                  // 记忆有效：恢复几何（Rust 侧已 clamp 到工作区）
                  await appWin.setPosition(physPos(mem));
                  await fitSize(mem.w, mem.h);
                  if (mem.maximized) {
                    const wa = await getWorkArea();
                    if (wa) {
                      savedRect = { x: mem.x, y: mem.y, w: mem.w, h: mem.h };
                      await appWin.setPosition(
                        new window.__TAURI__.window.PhysicalPosition(wa[0], wa[1])
                      );
                      await fitSize(wa[2], wa[3]);
                      syncMax();
                    }
                  }
                } else {
                  // 无记忆：首启居中
                  const wa = await getWorkArea();
                  const size = await appWin.outerSize();
                  const x = wa[0] + Math.round((wa[2] - size.width) / 2);
                  const y = wa[1] + Math.round((wa[3] - size.height) / 2);
                  await appWin.setPosition(
                    new window.__TAURI__.window.PhysicalPosition(Math.max(0, x), Math.max(0, y))
                  );
                }
              } catch (e) {}
            }
          });
        } catch (e) {}
      }
      // 兜底：无论加载是否完成，5 秒后必须显示窗口（防止意外永久隐藏）
      setTimeout(showWindow, 5000);

      // 窗口移动/缩放 → 防抖保存（应用常驻托盘，无法依赖"退出时保存"；
      // 变更即落盘，随时退出都有最新状态）
      try {
        appWin.onMoved(function () { scheduleSave(null); });
        appWin.onResized(function () { scheduleSave(null); });
        // Task 11：DPI/缩放变化（换显示器或系统缩放率调整）→ 延迟后
        // 检查当前几何是否越出工作区，越界则经 clamp_rect 修正
        // （还原路径已自带 clamp，此处兜底"非还原状态下"的越界窗口）
        if (appWin.onScaleChanged) {
          appWin.onScaleChanged(function () {
            setTimeout(function () {
              (async function () {
                try {
                  const pos = await appWin.outerPosition();
                  const size = await appWin.outerSize();
                  const cl = await invoke("clamp_rect", {
                    x: pos.x, y: pos.y, w: size.width, h: size.height,
                  });
                  if (!cl) return;
                  if (cl[0] !== pos.x || cl[1] !== pos.y) {
                    await appWin.setPosition(
                      new window.__TAURI__.window.PhysicalPosition(cl[0], cl[1])
                    );
                    await fitSize(cl[2], cl[3]);
                  }
                } catch (e) {}
              })();
            }, 300); // 等系统完成缩放重排再采样
          });
        }
      } catch (e) {}

      async function getWorkArea() {
        // 返回 [x, y, width, height]（物理像素，工作区 = 屏幕去掉任务栏）
        return window.__TAURI__.core.invoke("work_area");
      }
      // DWM 会给可调整大小的无边框窗口附加隐藏边框（约 16x9px 膨胀），
      // setSize 后实测并补偿，保证窗口精确贴合目标尺寸。
      async function fitSize(w, h) {
        await appWin.setSize(new window.__TAURI__.window.PhysicalSize(w, h));
        const actual = await appWin.outerSize();
        if (actual.width !== w || actual.height !== h) {
          await appWin.setSize(
            new window.__TAURI__.window.PhysicalSize(w - (actual.width - w), h - (actual.height - h))
          );
        }
      }
      async function syncMax() {
        try {
          const size = await appWin.outerSize();
          const wa = await getWorkArea();
          if (!wa) return;
          const nearFull =
            Math.abs(size.width - wa[2]) < 24 &&
            Math.abs(size.height - wa[3]) < 24;
          document.getElementById("titlebar").classList.toggle("maximized", nearFull);
        } catch (e) {}
      }
      // 还原 savedRect（Task 11：先经 clamp_rect 夹取进当前工作区——
      // 显示器切换/DPI 变化后旧坐标可能越界，还原绝不越出工作区）
      async function restoreSavedRect() {
        if (!savedRect) return;
        try {
          const clamped = await invoke("clamp_rect", {
            x: savedRect.x, y: savedRect.y, w: savedRect.w, h: savedRect.h,
          });
          if (clamped) {
            await appWin.setPosition(
              new window.__TAURI__.window.PhysicalPosition(clamped[0], clamped[1])
            );
            await fitSize(clamped[2], clamped[3]);
            return;
          }
        } catch (e) {}
        // clamp 不可用（罕见）：退回原几何
        await appWin.setPosition(physPos(savedRect));
        await fitSize(savedRect.w, savedRect.h);
      }

      async function toggleMaximize() {
        try {
          // 贴靠态优先还原（双击/按钮在贴靠中 = 回到贴靠前几何）
          if (snappedDir) {
            snappedDir = null;
            await restoreSavedRect();
            syncMax();
            persistWindowState(null);
            return;
          }
          const size = await appWin.outerSize();
          const wa = await getWorkArea();
          if (!wa) return;
          const nearFull =
            Math.abs(size.width - wa[2]) < 24 &&
            Math.abs(size.height - wa[3]) < 24;
          if (nearFull) {
            // 还原
            await restoreSavedRect();
          } else {
            savedRect = {
              x: (await appWin.outerPosition()).x,
              y: (await appWin.outerPosition()).y,
              w: size.width,
              h: size.height,
            };
            await appWin.setPosition(
              new window.__TAURI__.window.PhysicalPosition(wa[0], wa[1])
            );
            await fitSize(wa[2], wa[3]);
          }
          syncMax();
          // 最大化/还原切换是离散事件：立即保存（onMoved/onResized 的防抖
          // 兜底会再合批一次，幂等无害）
          persistWindowState(null);
        } catch (e) {}
      }

      document.getElementById("btn-min").addEventListener("click", function () {
        appWin.minimize();
      });
      document.getElementById("btn-max").addEventListener("click", toggleMaximize);
      // 关闭 -> 触发 Rust 侧 CloseRequested（隐藏到托盘，应用常驻）
      document.getElementById("btn-close").addEventListener("click", function () {
        appWin.close();
      });

      // ===== Windows 11 风格贴靠（半屏/象限 + Win+方向键）=====
      // 系统贴靠被无边框+maximizable(false) 禁用，这里按 work_area 计算贴靠几何。
      // 贴靠状态机与伪最大化共用 savedRect：贴靠首存（手动几何）→ 还原回 savedRect；
      // 贴靠中再次贴靠不覆盖 savedRect。
      let snappedDir = null; // "left"|"right"|"up-left"|"up-right"|"down-left"|"down-right"|null

      // 计算 6 张贴靠几何（基于 work_area 的物理像素分区）
      function snapGeometries(wa) {
        const halfW = Math.round(wa[2] / 2);
        const halfH = Math.round(wa[3] / 2);
        return {
          "left": { x: wa[0], y: wa[1], w: halfW, h: wa[3] },
          "right": { x: wa[0] + halfW, y: wa[1], w: wa[2] - halfW, h: wa[3] },
          "up-left": { x: wa[0], y: wa[1], w: halfW, h: halfH },
          "up-right": { x: wa[0] + halfW, y: wa[1], w: wa[2] - halfW, h: halfH },
          "down-left": { x: wa[0], y: wa[1] + halfH, w: halfW, h: wa[3] - halfH },
          "down-right": { x: wa[0] + halfW, y: wa[1] + halfH, w: wa[2] - halfW, h: wa[3] - halfH },
        };
      }

      // 贴靠到指定方向（自动保存还原几何；重复同向贴靠 = 还原）
      async function snapTo(dir) {
        try {
          const wa = await getWorkArea();
          if (!wa) return;
          // 重复同向：还原（Windows 语义：再次 Win+方向键 / 拖回还原）
          if (snappedDir === dir) {
            snappedDir = null;
            await restoreSavedRect();
            return;
          }
          // 首次贴靠（非最大化、非贴靠态）：保存当前手动几何
          const size = await appWin.outerSize();
          const nearFull =
            Math.abs(size.width - wa[2]) < 24 && Math.abs(size.height - wa[3]) < 24;
          if (snappedDir === null && !nearFull && !savedRect) {
            const pos = await appWin.outerPosition();
            savedRect = { x: pos.x, y: pos.y, w: size.width, h: size.height };
          }
          const g = snapGeometries(wa)[dir];
          if (!g) return;
          await appWin.setPosition(physPos(g));
          await fitSize(g.w, g.h);
          snappedDir = dir;
          syncMax();
          persistWindowState(null);
        } catch (e) {}
      }

      // 由 screen 坐标判定贴靠区（视口边缘热区 24px 内）：
      // 左/右边缘 → 半屏；左上/右上/左下/右下角 → 象限；其余 → null
      function snapDirAtScreen(sx, sy, wa) {
        const EDGE = 24;
        const halfW = wa[2] / 2;
        const halfH = wa[3] / 2;
        const left = sx >= wa[0] && sx <= wa[0] + EDGE;
        const right = sx >= wa[0] + wa[2] - EDGE && sx <= wa[0] + wa[2];
        const top = sy <= wa[1] + EDGE;
        const bottom = sy >= wa[1] + wa[3] - EDGE;
        if (left && top) return "up-left";
        if (left && bottom) return "down-left";
        if (right && top) return "up-right";
        if (right && bottom) return "down-right";
        if (left && sy >= wa[1] + halfH - EDGE && sy <= wa[1] + halfH + EDGE) return "left"; // 左缘中段 → 左半屏
        if (right && sy >= wa[1] + halfH - EDGE && sy <= wa[1] + halfH + EDGE) return "right"; // 右缘中段 → 右半屏
        return null;
      }

      // Win+方向键：←/→ 左右半屏；↑ 最大化（复用）；↓ 还原/最小化
      document.addEventListener("keydown", function (e) {
        if (IS_MAC) return; // macOS 原生全屏语义不同，不混淆
        if (!e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
        var k = e.key;
        if (k !== "ArrowLeft" && k !== "ArrowRight" && k !== "ArrowUp" && k !== "ArrowDown") return;
        e.preventDefault();
        if (k === "ArrowLeft") { snapTo("left"); }
        else if (k === "ArrowRight") { snapTo("right"); }
        else if (k === "ArrowUp") {
          if (snappedDir) { snappedDir = null; toggleMaximize(); }
          else { toggleMaximize(); }
        }
        else { // ArrowDown
          if (snappedDir) {
            snappedDir = null;
            restoreSavedRect();
          } else {
            appWin.minimize();
          }
        }
      });

      // 双击拖拽区：Windows 伪最大化/还原；macOS 切换原生全屏（绿色按钮同款行为，
      // 由系统全屏空间 + 动画完成；无边框窗口曾因无红绿灯而无法全屏）
      const drag = document.getElementById("drag-region");
      drag.addEventListener("dblclick", function () {
        if (IS_MAC) {
          appWin.isFullscreen().then(function (fs) {
            appWin.setFullscreen(!fs);
          }).catch(function () {});
        } else {
          toggleMaximize();
        }
      });
      // 单击拖动窗口：自绘拖拽（mousedown 延迟 150ms 区分双击；若用系统
      // startDragging 则拿不到松手位置，无法做边缘贴靠热区判定）。
      // 松手时检测屏幕边缘热区：命中 → 贴靠；未命中 → 停留在新位置。
      drag.addEventListener("mousedown", function (e) {
        if (e.detail > 1) return;
        if (e.button !== 0) return;
        var t = setTimeout(function () {
          startDrag(e);
        }, 150);
        drag.addEventListener(
          "mouseup",
          function () { clearTimeout(t); },
          { once: true }
        );
      });
      function startDrag(e) {
        // 贴靠态开始拖拽 → 立即还原（Windows 行为：拖动贴靠窗口先还原再跟随）
        if (snappedDir && savedRect) {
          snappedDir = null;
          restoreSavedRect();
        }
        const sx = e.screenX;
        const sy = e.screenY;
        let origin = null;
        function onMove(ev) {
          (async function () {
            if (!origin) {
              const pos = await appWin.outerPosition();
              origin = { x: pos.x, y: pos.y };
            }
            const dx = ev.screenX - sx;
            const dy = ev.screenY - sy;
            await appWin.setPosition(
              new window.__TAURI__.window.PhysicalPosition(origin.x + dx, origin.y + dy)
            );
          })().catch(function () {});
        }
        function onUp(ev) {
          window.removeEventListener("mousemove", onMove);
          // 屏幕边缘热区命中 → 贴靠（Windows 11 拖拽贴靠手感）；
          // 未命中 → 已还原且跟随鼠标，停留当前位置。
          (async function () {
            try {
              const wa = await getWorkArea();
              if (!wa) return;
              const dir = snapDirAtScreen(ev.screenX, ev.screenY, wa);
              if (dir) await snapTo(dir);
            } catch (err) {}
          })();
          syncMax();
        }
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp, { once: true });
      }

      // ===== 自绘边缘 resize（窗口无 WS_THICKFRAME，边缘热区拖拽调整大小）=====
      const MIN_W = 860;
      const MIN_H = 620;
      function startResize(dir, e) {
        if (e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        const sx = e.screenX;
        const sy = e.screenY;
        let rect = null;
        let raf = 0;
        function onMove(ev) {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(function () {
            (async function () {
              if (!rect) {
                const pos = await appWin.outerPosition();
                const size = await appWin.outerSize();
                rect = { x: pos.x, y: pos.y, w: size.width, h: size.height };
              }
              const dx = ev.screenX - sx;
              const dy = ev.screenY - sy;
              let nx = rect.x, ny = rect.y, nw = rect.w, nh = rect.h;
              if (dir.indexOf("e") >= 0) nw = rect.w + dx;
              if (dir.indexOf("s") >= 0) nh = rect.h + dy;
              if (dir.indexOf("w") >= 0) { nw = rect.w - dx; nx = rect.x + dx; }
              if (dir.indexOf("n") >= 0) { nh = rect.h - dy; ny = rect.y + dy; }
              if (nw < MIN_W) {
                if (dir.indexOf("w") >= 0) nx = rect.x + rect.w - MIN_W;
                nw = MIN_W;
              }
              if (nh < MIN_H) {
                if (dir.indexOf("n") >= 0) ny = rect.y + rect.h - MIN_H;
                nh = MIN_H;
              }
              await appWin.setPosition(
                new window.__TAURI__.window.PhysicalPosition(nx, ny)
              );
              await appWin.setSize(
                new window.__TAURI__.window.PhysicalSize(nw, nh)
              );
            })().catch(function () {});
          });
        }
        function onUp() {
          window.removeEventListener("mousemove", onMove);
          cancelAnimationFrame(raf);
          syncMax();
        }
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp, { once: true });
      }
      document.querySelectorAll(".resize-h").forEach(function (el) {
        el.addEventListener("mousedown", function (e) {
          startResize(el.getAttribute("data-dir"), e);
        });
      });

      // 窗口尺寸变化（含用户拖拽调整）时同步标题栏按钮图标
      window.addEventListener("resize", syncMax);
      syncMax();

      // ===== 服务检测（在线 10s / 离线 2s 自适应轮询；在线则加载 iframe，
      // 离线则显示覆盖层；iframe 15s 无响应提示重试）=====
      const frame = document.getElementById("dsh-frame");
      const overlay = document.getElementById("overlay");
      const statusText = document.getElementById("status-text");
      const errEl = document.getElementById("err");
      let frameLoaded = false;
      let loadedOk = false;
      let loadTimer = null;

      // ===== 标题栏连接状态圆点（与 tick 同源：offline/loading/online）=====
      const statusDot = document.getElementById("status-dot");
      let lastCheckAt = null; // 最近一次服务检测时刻
      function setStatus(mode) {
        // 三态类名（offline=红 / loading=黄 / online=绿），title 显示 URL + 检测时间
        statusDot.classList.remove("offline", "loading", "online");
        statusDot.classList.add(mode);
        const t = lastCheckAt
          ? new Date(lastCheckAt).toLocaleTimeString()
          : "尚未检测";
        statusDot.title = `DSH 服务：${mode === "online" ? "在线" : mode === "loading" ? "加载中" : "离线"} · ${DSH_URL} · ${t}`;
      }

      // GUI 加载完成（iframe load）后显示窗口，避免启动闪色
      frame.addEventListener("load", function () {
        loadedOk = true;
        if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
        setStatus("online"); // 页面加载完成：即时转绿（不等下一轮 tick）
        showWindow();
      });

      async function check() {
        // no-cors：只关心可达性（网络错误 reject，任何 HTTP 响应都算可达）
        return fetch(DSH_URL, { mode: "no-cors", cache: "no-store" })
          .then(function () { return true; })
          .catch(function () { return false; });
      }
      async function tick() {
        lastCheckAt = Date.now();
        const ok = await check();
        if (ok) {
          overlay.classList.remove("show");
          invoke("set_tray_state", { online: true }).catch(function () {}); // 托盘图标置在线
          if (!frameLoaded) {
            frameLoaded = true;
            loadedOk = false;
            setStatus("loading"); // 可达但页面加载中（黄）
            frame.src = DSH_URL;
            // 页面加载黑洞（如服务挂起不响应）→ 15s 后提示重试
            loadTimer = setTimeout(function () {
              if (!loadedOk) {
                statusText.textContent = "页面加载超时";
                errEl.textContent = "服务可达但页面 15s 未加载，请点击重试";
                showWindow();
                overlay.classList.add("show");
                setStatus("offline");
              }
            }, 15000);
          } else {
            setStatus("online"); // 已加载：在线（绿）
          }
          setTimeout(tick, 10000); // 在线：放宽轮询省资源
        } else {
          // 服务不可用：直接显示（提示页本身即完整内容，无需等待）
          showWindow();
          overlay.classList.add("show");
          setStatus("offline"); // 离线（红）
          invoke("set_tray_state", { online: false }).catch(function () {}); // 托盘图标置离线
          errEl.textContent = "尚未检测到服务（" + new Date().toLocaleTimeString() + "）";
          // 自动重启开关（Task 9）：开启时尝试自动拉起，节流在 Rust 侧
          // （10s 窗口内重复调用直接 Ok(0)，不会轰炸 spawn）；失败静默，
          // 交给下一轮 2s 轮询重试。
          try {
            if (await invoke("get_auto_restart")) {
              await invoke("auto_start_service");
            }
          } catch (e) {}
          setTimeout(tick, 2000);
        }
      }
      document.getElementById("retry").addEventListener("click", function () {
        errEl.textContent = "";
        statusText.textContent = "正在检测服务…";
        // 允许重新加载 iframe（服务恢复或页面加载失败后的重试）
        frameLoaded = false;
        loadedOk = false;
        if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
        frame.src = "about:blank";
        setStatus("loading");
        tick();
      });

      // ===== 设置弹层（T5.4）=====
      const settingsModal = document.getElementById("settings-modal");
      const settingsUrl = document.getElementById("settings-addr-select");
      const settingsAddrInput = document.getElementById("settings-addr-input");
      const settingsAddrSwitch = document.getElementById("settings-addr-switch");
      const settingsAddrHint = document.getElementById("settings-addr-hint");
      const settingsAuto = document.getElementById("settings-autostart");
      const settingsCloseExit = document.getElementById("settings-close-exit");
      const settingsCloseHint = document.getElementById("settings-close-hint");
      const settingsAutoRestart = document.getElementById("settings-auto-restart");
      const settingsRestartHint = document.getElementById("settings-restart-hint");
      const settingsUpdateBtn = document.getElementById("settings-update-check");
      const settingsUpdateInstallBtn = document.getElementById("settings-update-install");
      const settingsUpdateResult = document.getElementById("settings-update-result");
      const settingsVersion = document.getElementById("settings-version");
      const settingsOpenLogs = document.getElementById("settings-open-logs");
      let pendingUpdate = null; // update_check 发现的新版本号（有值 = 启用「更新」按钮）

      function updateCloseHint() {
        settingsCloseHint.textContent = settingsCloseExit.checked
          ? "开：点击关闭即退出应用"
          : "关（默认）：关闭隐藏到托盘";
      }
      // ===== 服务地址选择（Task 10）=====
      // 填充历史下拉（当前地址 + 历史列表），输入框展示当前值
      function fillAddressOptions(history) {
        settingsUrl.replaceChildren();
        const current = DSH_URL;
        const opts = [current].concat(history.filter(function (a) { return a !== current; }));
        opts.forEach(function (addr) {
          const opt = document.createElement("option");
          opt.value = addr;
          opt.textContent = addr;
          settingsUrl.appendChild(opt);
        });
        settingsAddrInput.value = current;
      }
      // 切换地址：本机校验 + 可达性探测 → 更新 DSH_URL → 重载 iframe → 保存历史 → 重跑 tick
      async function switchAddress(addrRaw) {
        const addr = (addrRaw || "").trim();
        if (!addr) { settingsAddrHint.textContent = "请输入服务地址"; return; }
        // 本机地址校验（CSP frame-src 静态限制：非本机无法加载）
        const isLocal = /^https?:\/\/(127\.0\.0\.1|localhost):\d+/.test(addr);
        if (!isLocal) {
          settingsAddrHint.textContent = "仅本机地址可加载（127.0.0.1/localhost）；非本机地址受 CSP 限制";
          return;
        }
        if (addr === DSH_URL) {
          settingsAddrHint.textContent = "已是当前地址";
          return;
        }
        settingsAddrSwitch.disabled = true;
        settingsAddrHint.textContent = "正在探测…";
        try {
          const reachable = await invoke("probe_address", { addr: addr });
          if (!reachable) {
            settingsAddrHint.textContent = "该地址当前不可达（服务未启动？）";
            return;
          }
          // 切换：更新单一事实源 + 重载 iframe + 立即检测
          DSH_URL = addr;
          frameLoaded = false;
          loadedOk = false;
          if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
          frame.src = "about:blank";
          overlay.classList.remove("show");
          setStatus("loading");
          tick();
          // 保存历史（去重/上限在 Rust 侧）
          const hist = await invoke("get_address_history");
          invoke("set_address_history", { list: hist.concat([addr]) }).catch(function () {});
          settingsAddrHint.textContent = "已切换，正在加载…";
          // 同步标题栏工具提示（含 URL）
          setStatus("loading");
        } catch (e) {
          settingsAddrHint.textContent = String(e);
        } finally {
          settingsAddrSwitch.disabled = false;
        }
      }
      // 下拉选中 → 填入输入框（不自动切换，防止误点）
      settingsUrl.addEventListener("change", function () {
        settingsAddrInput.value = settingsUrl.value;
      });
      settingsAddrSwitch.addEventListener("click", function () {
        switchAddress(settingsAddrInput.value);
      });
      settingsAddrInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") switchAddress(settingsAddrInput.value);
      });

      function openSettings() {
        settingsAddrHint.textContent = "仅本机地址可加载（127.0.0.1/localhost）";
        settingsUpdateResult.textContent = "";
        settingsUpdateInstallBtn.disabled = true;
        pendingUpdate = null;
        // 填充地址历史（最新在前）
        invoke("get_address_history").then(function (h) {
          fillAddressOptions(h || []);
        }).catch(function () {
          fillAddressOptions([]);
        });
        // 读取当前应用版本
        invoke("app_version").then(function (v) {
          settingsVersion.textContent = "v" + v;
        }).catch(function () {
          settingsVersion.textContent = "";
        });
        // 读取开机自启状态
        invoke("autostart_state").then(function (v) {
          settingsAuto.checked = !!v;
        }).catch(function () {});
        // 读取「关闭时退出」开关
        invoke("get_close_behavior").then(function (v) {
          settingsCloseExit.checked = !!v;
          updateCloseHint();
        }).catch(function () {});
        // 读取「服务崩溃自动重启」开关
        invoke("get_auto_restart").then(function (v) {
          settingsAutoRestart.checked = !!v;
          settingsRestartHint.textContent = v
            ? "开：服务异常退出后自动重新拉起（10s 节流）"
            : "开：服务异常退出后自动重新拉起";
        }).catch(function () {});
        settingsModal.classList.add("show");
      }
      function closeSettings() { settingsModal.classList.remove("show"); }
      document.getElementById("btn-settings").addEventListener("click", openSettings);
      document.getElementById("settings-close").addEventListener("click", closeSettings);
      settingsModal.addEventListener("click", function (e) {
        if (e.target === settingsModal) closeSettings(); // 点击遮罩关闭
      });
      // 托盘"设置…"入口
      window.__TAURI__.event.listen("open-settings", function () { openSettings(); });

      settingsCloseExit.addEventListener("change", function () {
        const want = settingsCloseExit.checked;
        invoke("set_close_behavior", { enabled: want }).then(function () {
          updateCloseHint();
        }).catch(function (e) {
          settingsCloseExit.checked = !want;
          settingsUpdateResult.textContent = String(e);
        });
      });

      settingsAutoRestart.addEventListener("change", function () {
        const want = settingsAutoRestart.checked;
        invoke("set_auto_restart", { enabled: want }).then(function () {
          settingsRestartHint.textContent = want
            ? "开：服务异常退出后自动重新拉起（10s 节流）"
            : "开：服务异常退出后自动重新拉起";
        }).catch(function (e) {
          settingsAutoRestart.checked = !want;
          settingsUpdateResult.textContent = String(e);
        });
      });

      settingsAuto.addEventListener("change", function () {
        invoke("autostart_toggle").then(function (v) {
          settingsAuto.checked = !!v;
        }).catch(function (e) {
          settingsAuto.checked = !settingsAuto.checked;
          settingsUpdateResult.textContent = String(e);
        });
      });

      settingsUpdateBtn.addEventListener("click", function () {
        settingsUpdateBtn.disabled = true;
        settingsUpdateResult.textContent = "检查中…";
        invoke("update_check").then(function (msg) {
          settingsUpdateResult.textContent = msg;
          if (msg.indexOf("发现新版本") === 0) {
            pendingUpdate = msg.slice("发现新版本".length).trim();
            settingsUpdateInstallBtn.disabled = false;
          } else {
            pendingUpdate = null;
            settingsUpdateInstallBtn.disabled = true;
          }
        }).catch(function (e) {
          settingsUpdateResult.textContent = String(e);
          pendingUpdate = null;
          settingsUpdateInstallBtn.disabled = true;
        }).finally(function () {
          settingsUpdateBtn.disabled = false;
        });
      });

      settingsUpdateInstallBtn.addEventListener("click", function () {
        settingsUpdateInstallBtn.disabled = true;
        settingsUpdateBtn.disabled = true;
        settingsUpdateResult.textContent = "正在下载并安装 " + pendingUpdate + "…";
        invoke("update_install").then(function (msg) {
          settingsUpdateResult.textContent = msg; // 安装完成后应用将重启，提示短暂可见
        }).catch(function (e) {
          settingsUpdateResult.textContent = String(e);
          settingsUpdateInstallBtn.disabled = false;
          settingsUpdateBtn.disabled = false;
        });
      });

      settingsOpenLogs.addEventListener("click", function () {
        invoke("open_log_dir").catch(function (e) {
          settingsUpdateResult.textContent = String(e);
        });
      });

      // ===== 拉起 DSH 服务（T5.1：方案 B 纯拉起，不捆绑 sidecar）=====
      const startBtn = document.getElementById("service-start");
      startBtn.addEventListener("click", async function () {
        startBtn.disabled = true;
        startBtn.textContent = "正在启动…";
        errEl.textContent = "";
        try {
          const pid = await invoke("service_start");
          if (pid === 0) {
            errEl.textContent = "服务已在运行，正在连接…";
          } else {
            errEl.textContent = "已拉起 DSH 服务（pid=" + pid + "），等待就绪…";
          }
          // 交由 2s 轮询检测到服务后自动进入
        } catch (e) {
          errEl.textContent = String(e);
        } finally {
          startBtn.disabled = false;
          startBtn.textContent = "启动 DSH 服务";
        }
      });
      tick();

    </script>
  </body>
</html>
